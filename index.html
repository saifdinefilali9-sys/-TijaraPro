<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TijaraPro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  padding:25px 16px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:7px;
  opacity:.9;
}

.version{
  display:inline-block;
  margin-top:12px;
  background:rgba(255,255,255,.18);
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}

nav{
  background:white;
  display:flex;
  gap:8px;
  padding:10px;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

nav button{
  border:0;
  background:#eef3ff;
  color:#1d4ed8;
  padding:11px 15px;
  border-radius:12px;
  white-space:nowrap;
  font-size:14px;
  cursor:pointer;
}

nav button.active{
  background:#2563eb;
  color:white;
}

.container{
  max-width:950px;
  margin:auto;
  padding:16px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.welcome{
  background:linear-gradient(135deg,#eff6ff,#ffffff);
}

h2{
  margin-bottom:15px;
  font-size:21px;
}

h3{
  margin-bottom:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:white;
  padding:17px 10px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.stat .icon{
  font-size:25px;
}

.stat strong{
  display:block;
  margin-top:7px;
  font-size:19px;
}

.stat span{
  font-size:13px;
  color:#667085;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.actions button{
  border:0;
  background:#eef3ff;
  color:#1d4ed8;
  padding:15px 8px;
  border-radius:14px;
  font-size:14px;
  cursor:pointer;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d8dee9;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

.primary{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  margin-top:12px;
  cursor:pointer;
}

.secondary{
  border:0;
  background:#eef2f7;
  color:#344054;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.danger{
  background:#fee2e2;
  color:#b42318;
}

.search{
  margin-bottom:15px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.product-card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  border:2px solid transparent;
}

.product-image{
  width:100%;
  height:140px;
  object-fit:cover;
  background:#eef2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.product-info{
  padding:12px;
}

.product-info h3{
  font-size:16px;
}

.price{
  color:#2563eb;
  font-weight:bold;
  margin:6px 0;
}

.stock{
  font-size:13px;
  color:#667085;
}

.low{
  color:#d97706;
  font-weight:bold;
}

.out{
  color:#dc2626;
  font-weight:bold;
}

.product-buttons{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.product-buttons button{
  flex:1;
  border:0;
  padding:9px 5px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
}

.sell-btn{
  background:#2563eb;
  color:white;
}

.edit-btn{
  background:#eef2ff;
  color:#1d4ed8;
}

.delete-btn{
  background:#fee2e2;
  color:#b42318;
}

.sale-layout{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:15px;
}

.sale-products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.sale-product{
  background:white;
  border:2px solid transparent;
  border-radius:14px;
  padding:10px;
  cursor:pointer;
}

.sale-product:hover{
  border-color:#2563eb;
}

.sale-product img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}

.sale-product .emoji{
  height:100px;
  background:#eef2f7;
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:38px;
}

.cart{
  background:white;
  border-radius:18px;
  padding:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  height:max-content;
  position:sticky;
  top:70px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid #edf0f4;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:5px;
}

.cart-controls button{
  border:0;
  width:28px;
  height:28px;
  border-radius:8px;
  cursor:pointer;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.invoice-card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.invoice-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.invoice-number{
  color:#2563eb;
  font-weight:bold;
}

.invoice-total{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

.invoice-buttons{
  display:flex;
  gap:8px;
}

.invoice-buttons button{
  flex:1;
  border:0;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.view-invoice{
  background:#2563eb;
  color:white;
}

.delete-invoice{
  background:#fee2e2;
  color:#b42318;
}

.empty{
  text-align:center;
  color:#667085;
  padding:30px 10px;
}

#invoicePrint{
  display:none;
}

/* شاشة الفاتورة */
.invoice-paper{
  max-width:700px;
  margin:auto;
  background:white;
  padding:30px;
}

.invoice-paper-header{
  text-align:center;
  border-bottom:2px solid #222;
  padding-bottom:15px;
  margin-bottom:18px;
}

.invoice-paper-header h1{
  margin-bottom:8px;
}

.invoice-meta{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  font-size:14px;
}

.invoice-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
}

.invoice-table th,
.invoice-table td{
  border-bottom:1px solid #ddd;
  padding:10px 5px;
  text-align:right;
}

.invoice-table th{
  background:#f3f4f6;
}

.invoice-final{
  text-align:left;
  font-size:20px;
  font-weight:bold;
  border-top:2px solid #222;
  padding-top:12px;
}

.print-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.print-actions button{
  flex:1;
  border:0;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.print-btn{
  background:#2563eb;
  color:white;
}

.close-btn{
  background:#eef2f7;
}

@media(max-width:750px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .actions{
    grid-template-columns:repeat(2,1fr);
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .sale-layout{
    grid-template-columns:1fr;
  }

  .cart{
    position:static;
  }

  .form-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:430px){
  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .product-image{
    height:115px;
  }

  .sale-products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media print{
  body{
    background:white;
  }

  body > *{
    display:none !important;
  }

  #invoicePrint{
    display:block !important;
  }

  .print-actions{
    display:none !important;
  }

  .invoice-paper{
    box-shadow:none;
    max-width:none;
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">TijaraPro</div>
  <div class="subtitle">نظام البيع وإدارة المحل</div>
  <div class="version">الإصدار 1.2</div>
</header>

<nav>
  <button class="nav-btn active" onclick="showSection('dashboard',this)">🏠 الرئيسية</button>
  <button class="nav-btn" onclick="showSection('sales',this)">🛒 البيع السريع</button>
  <button class="nav-btn" onclick="showSection('products',this)">📦 المنتجات</button>
  <button class="nav-btn" onclick="showSection('invoices',this)">🧾 الفواتير</button>
</nav>

<div class="container">

  <!-- الرئيسية -->
  <section id="dashboard" class="section active">

    <div class="card welcome">
      <h2>مرحبًا بك في TijaraPro 👋</h2>
      <p>نظام بسيط وسريع لإدارة البيع والمخزون والفواتير.</p>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="icon">💰</div>
        <strong id="todaySales">0 دج</strong>
        <span>مبيعات اليوم</span>
      </div>

      <div class="stat">
        <div class="icon">📦</div>
        <strong id="productCount">0</strong>
        <span>المنتجات</span>
      </div>

      <div class="stat">
        <div class="icon">🛒</div>
        <strong id="salesCount">0</strong>
        <span>المبيعات</span>
      </div>

      <div class="stat">
        <div class="icon">📈</div>
        <strong id="todayProfit">0 دج</strong>
        <span>أرباح اليوم</span>
      </div>

    </div>

    <div class="card" style="margin-top:16px">
      <h2>⚡ إجراءات سريعة</h2>

      <div class="actions">
        <button onclick="goTo('sales')">🛒 بيع منتج</button>
        <button onclick="goTo('products')">📦 المنتجات</button>
        <button onclick="goTo('products');setTimeout(()=>document.getElementById('productName').focus(),100)">➕ إضافة منتج</button>
        <button onclick="goTo('invoices')">🧾 الفواتير</button>
      </div>
    </div>

  </section>


  <!-- المنتجات -->
  <section id="products" class="section">

    <div class="card">

      <h2 id="productFormTitle">➕ إضافة منتج</h2>

      <div class="form-grid">

        <div>
          <label>اسم المنتج</label>
          <input id="productName" placeholder="مثال: قميص">
        </div>

        <div>
          <label>سعر الشراء</label>
          <input id="buyPrice" type="number" placeholder="1000">
        </div>

        <div>
          <label>سعر البيع</label>
          <input id="sellPrice" type="number" placeholder="1500">
        </div>

        <div>
          <label>الكمية</label>
          <input id="stock" type="number" placeholder="10">
        </div>

        <div>
          <label>صورة المنتج</label>
          <input id="productImage" type="file" accept="image/*">
        </div>

      </div>

      <button class="primary" onclick="saveProduct()" id="saveProductButton">
        إضافة المنتج
      </button>

      <button class="secondary" onclick="cancelEdit()" id="cancelEditButton" style="display:none;width:100%;margin-top:8px">
        إلغاء التعديل
      </button>

    </div>


    <div class="card">

      <h2>📦 المنتجات</h2>

      <input
        class="search"
        id="productSearch"
        placeholder="🔎 ابحث عن منتج..."
        oninput="renderProducts()"
      >

      <div id="productsGrid" class="products-grid"></div>

    </div>

  </section>


  <!-- البيع -->
  <section id="sales" class="section">

    <div class="card">

      <h2>🛒 البيع السريع</h2>

      <input
        class="search"
        id="saleSearch"
        placeholder="🔎 ابحث عن منتج..."
        oninput="renderSaleProducts()"
      >

      <div class="sale-layout">

        <div>
          <div id="saleProductsGrid" class="sale-products"></div>
        </div>

        <div class="cart">

          <h3>🛍️ السلة</h3>

          <div id="cartList"></div>

          <div class="cart-total">
            <span>المجموع</span>
            <span id="cartTotal">0 دج</span>
          </div>

          <button class="primary" onclick="completeSale()">
            ✅ إتمام البيع
          </button>

          <button
            class="secondary"
            onclick="clearCart()"
            style="width:100%;margin-top:8px"
          >
            🗑️ إفراغ السلة
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- الفواتير -->
  <section id="invoices" class="section">

    <div class="card">

      <h2>🧾 الفواتير</h2>

      <div id="invoicesList"></div>

    </div>

  </section>

</div>


<!-- شاشة طباعة الفاتورة -->
<div id="invoicePrint"></div>


<script>

let products =
  JSON.parse(localStorage.getItem("tijara_products")) || [];

let sales =
  JSON.parse(localStorage.getItem("tijara_sales")) || [];

let invoices =
  JSON.parse(localStorage.getItem("tijara_invoices")) || [];

let cart = [];

let editingProductId = null;


/* ---------------- البيانات ---------------- */

function saveData(){

  localStorage.setItem(
    "tijara_products",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "tijara_sales",
    JSON.stringify(sales)
  );

  localStorage.setItem(
    "tijara_invoices",
    JSON.stringify(invoices)
  );
}


function money(value){

  return Number(value || 0)
    .toLocaleString("ar-DZ") + " دج";
}


function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ---------------- التنقل ---------------- */

function showSection(id,button){

  document.querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".nav-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  if(button){
    button.classList.add("active");
  }

  if(id==="products"){
    renderProducts();
  }

  if(id==="sales"){
    renderSaleProducts();
    renderCart();
  }

  if(id==="invoices"){
    renderInvoices();
  }
}


function goTo(id){

  const buttons =
    document.querySelectorAll(".nav-btn");

  let button = null;

  buttons.forEach(btn=>{

    if(
      (id==="dashboard" && btn.innerText.includes("الرئيسية")) ||
      (id==="sales" && btn.innerText.includes("البيع")) ||
      (id==="products" && btn.innerText.includes("المنتجات")) ||
      (id==="invoices" && btn.innerText.includes("الفواتير"))
    ){
      button = btn;
    }

  });

  showSection(id,button);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ---------------- المنتجات ---------------- */

function saveProduct(){

  const name =
    document.getElementById("productName").value.trim();

  const buy =
    Number(document.getElementById("buyPrice").value);

  const sell =
    Number(document.getElementById("sellPrice").value);

  const stock =
    Number(document.getElementById("stock").value);

  const imageInput =
    document.getElementById("productImage");

  if(!name){

    alert("أدخل اسم المنتج");

    return;
  }

  if(buy < 0 || sell < 0 || stock < 0){

    alert("تحقق من الأسعار والكمية");

    return;
  }


  if(editingProductId){

    updateProduct(
      editingProductId,
      name,
      buy,
      sell,
      stock,
      imageInput
    );

  }else{

    createProduct(
      name,
      buy,
      sell,
      stock,
      imageInput
    );

  }

}


function createProduct(
  name,
  buy,
  sell,
  stock,
  imageInput
){

  const finish = (image)=>{

    products.push({

      id:Date.now(),

      name:name,

      buy:buy,

      sell:sell,

      stock:stock,

      image:image || ""

    });

    saveData();

    resetProductForm();

    renderProducts();

    refresh();

    alert("✅ تمت إضافة المنتج");

  };


  if(imageInput.files.length){

    const reader = new FileReader();

    reader.onload = function(){

      finish(reader.result);

    };

    reader.readAsDataURL(
      imageInput.files[0]
    );

  }else{

    finish("");

  }

}


function updateProduct(
  id,
  name,
  buy,
  sell,
  stock,
  imageInput
){

  const product =
    products.find(p=>p.id===id);

  if(!product) return;


  const finish = (image)=>{

    product.name = name;

    product.buy = buy;

    product.sell = sell;

    product.stock = stock;

    if(image){
      product.image = image;
    }

    saveData();

    resetProductForm();

    renderProducts();

    renderSaleProducts();

    refresh();

    alert("✅ تم تعديل المنتج");

  };


  if(imageInput.files.length){

    const reader = new FileReader();

    reader.onload = function(){

      finish(reader.result);

    };

    reader.readAsDataURL(
      imageInput.files[0]
    );

  }else{

    finish(product.image);

  }

}


function editProduct(id){

  const product =
    products.find(p=>p.id===id);

  if(!product) return;


  editingProductId = id;

  document.getElementById("productName").value =
    product.name;

  document.getElementById("buyPrice").value =
    product.buy;

  document.getElementById("sellPrice").value =
    product.sell;

  document.getElementById("stock").value =
    product.stock;

  document.getElementById("productFormTitle").innerText =
    "✏️ تعديل المنتج";

  document.getElementById("saveProductButton").innerText =
    "💾 حفظ التعديل";

  document.getElementById("cancelEditButton").style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function cancelEdit(){

  resetProductForm();

}


function resetProductForm(){

  editingProductId = null;

  document.getElementById("productName").value = "";

  document.getElementById("buyPrice").value = "";

  document.getElementById("sellPrice").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("productImage").value = "";

  document.getElementById("productFormTitle").innerText =
    "➕ إضافة منتج";

  document.getElementById("saveProductButton").innerText =
    "إضافة المنتج";

  document.getElementById("cancelEditButton").style.display =
    "none";

}


function deleteProduct(id){

  const product =
    products.find(p=>p.id===id);

  if(!product) return;


  if(
    !confirm(
      "هل تريد حذف المنتج: " +
      product.name +
      " ؟"
    )
  ){

    return;
  }


  products =
    products.filter(p=>p.id!==id);

  saveData();

  renderProducts();

  renderSaleProducts();

  refresh();

}


function renderProducts(){

  const grid =
    document.getElementById("productsGrid");

  const search =
    document.getElementById("productSearch")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(product=>
      product.name
        .toLowerCase()
        .includes(search)
    );


  if(!filtered.length){

    grid.innerHTML =
      `<div class="empty">
        لا توجد منتجات
      </div>`;

    return;
  }


  grid.innerHTML =
    filtered.map(product=>{

      let stockClass = "";

      let stockText =
        "المخزون: " +
        product.stock;


      if(product.stock<=0){

        stockClass="out";

        stockText="نفد المخزون";

      }else if(product.stock<=5){

        stockClass="low";

        stockText=
          "مخزون منخفض: " +
          product.stock;

      }


      const image =
        product.image
        ?
        `<img class="product-image"
              src="${product.image}"
              alt="">`
        :
        `<div class="product-image">📦</div>`;


      return `

        <div class="product-card">

          ${image}

          <div class="product-info">

            <h3>
              ${escapeHTML(product.name)}
            </h3>

            <div class="price">
              ${money(product.sell)}
            </div>

            <div class="stock ${stockClass}">
              ${stockText}
            </div>

            <div class="product-buttons">

              <button
                class="sell-btn"
                onclick="quickSell(${product.id})">
                بيع
              </button>

              <button
                class="edit-btn"
                onclick="editProduct(${product.id})">
                تعديل
              </button>

              <button
                class="delete-btn"
                onclick="deleteProduct(${product.id})">
                حذف
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* ---------------- البيع ---------------- */

function quickSell(id){

  goTo("sales");

  addToCart(id);

}


function addToCart(id){

  const product =
    products.find(p=>p.id===id);

  if(!product) return;


  if(product.stock<=0){

    alert("❌ المنتج غير متوفر في المخزون");

    return;
  }


  const item =
    cart.find(item=>item.productId===id);


  const currentQuantity =
    item ? item.quantity : 0;


  if(currentQuantity>=product.stock){

    alert("❌ لا توجد كمية كافية في المخزون");

    return;
  }


  if(item){

    item.quantity++;

  }else{

    cart.push({

      productId:product.id,

      name:product.name,

      price:product.sell,

      buy:product.buy,

      image:product.image,

      quantity:1

    });

  }


  renderCart();

}


function decreaseCart(id){

  const item =
    cart.find(item=>item.productId===id);

  if(!item) return;


  item.quantity--;


  if(item.quantity<=0){

    cart =
      cart.filter(item=>item.productId!==id);

  }


  renderCart();

}


function removeFromCart(id){

  cart =
    cart.filter(item=>item.productId!==id);

  renderCart();

}


function clearCart(){

  cart = [];

  renderCart();

}


function renderSaleProducts(){

  const grid =
    document.getElementById("saleProductsGrid");

  const search =
    document.getElementById("saleSearch")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(product=>
      product.name
        .toLowerCase()
        .includes(search)
    );


  if(!filtered.length){

    grid.innerHTML =
      `<div class="empty">
        لا توجد منتجات
      </div>`;

    return;
  }


  grid.innerHTML =
    filtered.map(product=>{

      const image =
        product.image
        ?
        `<img src="${product.image}" alt="">`
        :
        `<div class="emoji">📦</div>`;


      return `

        <div
          class="sale-product"
          onclick="addToCart(${product.id})">

          ${image}

          <h3>
            ${escapeHTML(product.name)}
          </h3>

          <div class="price">
            ${money(product.sell)}
          </div>

          <small>
            المخزون: ${product.stock}
          </small>

        </div>

      `;

    }).join("");

}


function renderCart(){

  const list =
    document.getElementById("cartList");

  const totalElement =
    document.getElementById("cartTotal");


  if(!cart.length){

    list.innerHTML =
      `<div class="empty">
        السلة فارغة
      </div>`;

    totalElement.innerText =
      "0 دج";

    return;
  }


  let total = 0;


  list.innerHTML =
    cart.map(item=>{

      const itemTotal =
        item.price * item.quantity;

      total += itemTotal;


      return `

        <div class="cart-item">

          <div>
            <strong>
              ${escapeHTML(item.name)}
            </strong>

            <div>
              ${money(item.price)}
            </div>
          </div>

          <div class="cart-controls">

            <button
              onclick="decreaseCart(${item.productId})">
              −
            </button>

            <span>
              ${item.quantity}
            </span>

            <button
              onclick="addToCart(${item.productId})">
              +
            </button>

            <button
              onclick="removeFromCart(${item.productId})"
              style="background:#fee2e2;color:#b42318">
              ×
            </button>

          </div>

        </div>

      `;

    }).join("");


  totalElement.innerText =
    money(total);

}


/* ---------------- إتمام البيع ---------------- */

function completeSale(){

  if(!cart.length){

    alert("السلة فارغة");

    return;
  }


  /* التحقق من المخزون */

  for(const item of cart){

    const product =
      products.find(p=>p.id===item.productId);

    if(!product){

      alert("أحد المنتجات لم يعد موجودًا");

      return;
    }


    if(item.quantity>product.stock){

      alert(
        "الكمية غير متوفرة للمنتج: " +
        product.name
      );

      return;
    }

  }


  let total = 0;

  let profit = 0;

  const items = [];


  cart.forEach(item=>{

    const product =
      products.find(p=>p.id===item.productId);


    const itemTotal =
      item.price * item.quantity;


    const itemProfit =
      (item.price - product.buy) *
      item.quantity;


    total += itemTotal;

    profit += itemProfit;


    items.push({

      productId:item.productId,

      name:item.name,

      quantity:item.quantity,

      price:item.price,

      buy:product.buy,

      total:itemTotal

    });


    product.stock -= item.quantity;

  });


  const saleId =
    Date.now();


  const now =
    new Date();


  const date =
    now.toLocaleString("ar-DZ");


  const invoiceNumber =
    "INV-" +
    String(
      invoices.length + 1
    ).padStart(4,"0");


  const sale = {

    id:saleId,

    date:date,

    items:items,

    total:total,

    profit:profit

  };


  sales.push(sale);


  const invoice = {

    id:saleId,

    number:invoiceNumber,

    date:date,

    items:items,

    total:total,

    profit:profit

  };


  invoices.push(invoice);


  saveData();


  cart = [];


  renderCart();

  renderProducts();

  renderSaleProducts();

  renderInvoices();

  refresh();


  alert(
    "✅ تمت عملية البيع\n\n" +
    "رقم الفاتورة: " +
    invoiceNumber
  );


  goTo("invoices");

}


/* ---------------- الفواتير ---------------- */

function renderInvoices(){

  const list =
    document.getElementById("invoicesList");


  if(!invoices.length){

    list.innerHTML =
      `<div class="empty">
        لا توجد فواتير بعد
      </div>`;

    return;
  }


  const sorted =
    [...invoices].reverse();


  list.innerHTML =
    sorted.map(invoice=>{

      return `

        <div class="invoice-card">

          <div class="invoice-head">

            <div>
              <strong>
                🧾 ${invoice.number}
              </strong>
            </div>

            <div>
              ${escapeHTML(invoice.date)}
            </div>

          </div>


          <div>
            عدد المنتجات:
            ${invoice.items.length}
          </div>


          <div class="invoice-total">
            ${money(invoice.total)}
          </div>


          <div class="invoice-buttons">

            <button
              class="view-invoice"
              onclick="viewInvoice(${invoice.id})">
              👁️ عرض الفاتورة
            </button>

            <button
              class="delete-invoice"
              onclick="deleteInvoice(${invoice.id})">
              🗑️ حذف
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function viewInvoice(id){

  const invoice =
    invoices.find(i=>i.id===id);

  if(!invoice) return;


  const itemsRows =
    invoice.items.map(item=>{

      return `

        <tr>

          <td>
            ${escapeHTML(item.name)}
          </td>

          <td>
            ${item.quantity}
          </td>

          <td>
            ${money(item.price)}
          </td>

          <td>
            ${money(item.total)}
          </td>

        </tr>

      `;

    }).join("");


  document.getElementById("invoicePrint").innerHTML = `

    <div class="invoice-paper">

      <div class="invoice-paper-header">

        <h1>TijaraPro</h1>

        <div>
          فاتورة بيع
        </div>

      </div>


      <div class="invoice-meta">

        <div>
          <strong>رقم الفاتورة:</strong>
          ${invoice.number}
        </div>

        <div>
          <strong>التاريخ:</strong>
          ${escapeHTML(invoice.date)}
        </div>

      </div>


      <table class="invoice-table">

        <thead>

          <tr>
            <th>المنتج</th>
            <th>الكمية</th>
            <th>السعر</th>
            <th>المجموع</th>
          </tr>

        </thead>

        <tbody>

          ${itemsRows}

        </tbody>

      </table>


      <div class="invoice-final">

        المجموع النهائي:
        ${money(invoice.total)}

      </div>


      <div style="margin-top:10px;text-align:left">

        الربح:
        ${money(invoice.profit)}

      </div>


      <div class="print-actions">

        <button
          class="print-btn"
          onclick="window.print()">
          🖨️ طباعة الفاتورة
        </button>

        <button
          class="close-btn"
          onclick="closeInvoice()">
          ← العودة
        </button>

      </div>

    </div>

  `;


  document.querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });


  document.getElementById("invoicePrint")
    .style.display = "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function closeInvoice(){

  document.getElementById("invoicePrint")
    .style.display = "none";

  goTo("invoices");

}


function deleteInvoice(id){

  if(
    !confirm(
      "هل تريد حذف هذه الفاتورة؟"
    )
  ){

    return;
  }


  invoices =
    invoices.filter(invoice=>invoice.id!==id);

  saveData();

  renderInvoices();

}


/* ---------------- الإحصائيات ---------------- */

function refresh(){

  const today =
    new Date().toLocaleDateString("ar-DZ");


  let todaySales = 0;

  let todayProfit = 0;


  sales.forEach(sale=>{

    const saleDate =
      new Date(sale.id)
        .toLocaleDateString("ar-DZ");


    if(saleDate===today){

      todaySales += sale.total;

      todayProfit += sale.profit;

    }

  });


  document.getElementById("todaySales")
    .innerText =
    money(todaySales);


  document.getElementById("todayProfit")
    .innerText =
    money(todayProfit);


  document.getElementById("productCount")
    .innerText =
    products.length;


  document.getElementById("salesCount")
    .innerText =
    sales.length;

}


/* ---------------- تشغيل النظام ---------------- */

function init(){

  renderProducts();

  renderSaleProducts();

  renderCart();

  renderInvoices();

  refresh();

}


init();

</script>
